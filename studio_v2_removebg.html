<!DOCTYPE html>
<html class="light" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Webmotors Cockpit - Estúdio</title>
    
    <!-- External Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-on-surface": "#f2efff",
                    "error-container": "#ffdad6",
                    "tertiary-fixed-dim": "#73d8c3",
                    "tertiary-fixed": "#8ff5df",
                    "secondary-container": "#c4c0ff",
                    "on-tertiary-container": "#fefffd",
                    "on-primary-container": "#fffdff",
                    "secondary-fixed": "#e3dfff",
                    "surface-variant": "#e3e1f1",
                    "primary-container": "#e22446",
                    "tertiary": "#006a5b",
                    "surface-container": "#efecfc",
                    "primary": "#bc0032",
                    "on-secondary-fixed": "#171348",
                    "outline-variant": "#e5bdbd",
                    "on-background": "#1a1b26",
                    "on-primary-fixed": "#40000b",
                    "on-surface": "#1a1b26",
                    "surface-container-highest": "#e3e1f1",
                    "surface-container-high": "#e9e6f7",
                    "surface-dim": "#dbd8e8",
                    "surface-container-low": "#f5f2ff",
                    "primary-fixed-dim": "#ffb3b4",
                    "on-secondary-fixed-variant": "#434176",
                    "on-primary": "#ffffff",
                    "surface": "#fcf8ff",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#920025",
                    "secondary": "#5b588f",
                    "on-tertiary": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-error": "#ffffff",
                    "inverse-surface": "#2f2f3b",
                    "secondary-fixed-dim": "#c4c0ff",
                    "on-tertiary-fixed-variant": "#005045",
                    "inverse-primary": "#ffb3b4",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed": "#00201b",
                    "error": "#ba1a1a",
                    "on-surface-variant": "#5c3f40",
                    "tertiary-container": "#008573",
                    "outline": "#906f6f",
                    "surface-tint": "#bf0033",
                    "surface-bright": "#fcf8ff",
                    "on-secondary-container": "#4f4c82",
                    "primary-fixed": "#ffdada",
                    "background": "#fcf8ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Figtree", "sans-serif"],
                    "body": ["Figtree", "sans-serif"],
                    "label": ["Figtree", "sans-serif"]
            }
          },
        },
      }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .signature-gradient {
            background: linear-gradient(135deg, #E22446 0%, #BC0032 100%);
        }
        .sidebar-dark {
            background-color: #1a1b26;
        }
        .before-after-slider {
            position: relative;
            overflow: hidden;
        }
        .after-image {
            clip-path: inset(0 0 0 50%); /* Start at 50% */
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;

    </style>
</head>
<body class="bg-[#F7F7F9] font-['Figtree'] text-on-surface antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        // --- Shared Components ---

        const Sidebar = ({ version = "standard" }) => {
            const navigate = useNavigate();
            const location = useLocation();

            if (version === "collapsed") {
                return (
                    <aside className="w-16 lg:w-48 bg-[#212121] text-white flex flex-col flex-shrink-0 z-50 transition-all">
                        <div className="p-4 flex items-center space-x-2">
                            <div className="w-8 h-8 flex items-center justify-center bg-white/10 rounded">
                                <span className="material-symbols-outlined text-white text-xl" style={{fontVariationSettings: "'FILL' 1"}}>speed</span>
                            </div>
                            <span className="hidden lg:block font-black text-lg tracking-tight">Cockpit</span>
                        </div>
                        <nav className="flex-1 px-2 py-4 space-y-1">
                            <Link to="/" className="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-white/10 transition-colors group">
                                <span className="material-symbols-outlined mr-3 text-slate-400 group-hover:text-white">home</span>
                                <span className="hidden lg:block">Início</span>
                            </Link>
                            <Link to="/" className="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-white/10 transition-colors group">
                                <span className="material-symbols-outlined mr-3 text-slate-400 group-hover:text-white">photo_library</span>
                                <span className="hidden lg:block">Galeria</span>
                            </Link>
                            <div className="space-y-1">
                                <button className="w-full flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-white/10 transition-colors group">
                                    <span className="material-symbols-outlined mr-3 text-slate-400 group-hover:text-white">directions_car</span>
                                    <span className="hidden lg:block">Estoque</span>
                                    <span className="ml-auto hidden lg:block material-symbols-outlined text-xs text-slate-500 transition-transform rotate-90">chevron_right</span>
                                </button>
                                <div className="pl-9 space-y-1">
                                    <Link to="/studio" className={`flex items-center px-3 py-2 text-sm font-medium rounded-md group ${location.pathname === '/studio' ? 'bg-white/10 text-white' : 'hover:bg-white/10 text-slate-400'}`}>
                                        <span className="material-symbols-outlined mr-3 text-[18px]" style={{fontVariationSettings: "'FILL' 1"}}>precision_manufacturing</span>
                                        <span className="hidden lg:block">Estúdio</span>
                                    </Link>
                                </div>
                            </div>
                        </nav>
                        <div className="p-4 border-t border-white/5">
                            <a href="#" className="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-white/10 transition-colors group">
                                <span className="material-symbols-outlined mr-3 text-slate-400 group-hover:text-white">settings</span>
                                <span className="hidden lg:block">Configurações</span>
                            </a>
                        </div>
                    </aside>
                );
            }

            return (
                <aside className="w-64 sidebar-dark text-slate-400 flex flex-col shrink-0">
                    <div className="h-16 flex items-center px-6 border-b border-slate-800">
                        <div className="flex items-center gap-2">
                            <span className="material-symbols-outlined text-white text-2xl" style={{fontVariationSettings: "'FILL' 1"}}>speed</span>
                            <span className="text-white font-bold text-lg tracking-tight">Cockpit</span>
                            <span className="material-symbols-outlined text-white/60 text-sm ml-auto">notifications</span>
                        </div>
                    </div>
                    <nav className="flex-1 py-4 overflow-y-auto">
                        <div className="px-6 py-2">
                            <Link to="/" className="flex items-center gap-3 text-sm py-2 hover:text-white transition-colors">
                                <span className="material-symbols-outlined text-[20px]">home</span>
                                Início
                            </Link>
                        </div>
                        <div className="px-6 py-2">
                            <div className="flex items-center justify-between text-sm py-2 cursor-pointer hover:text-white group">
                                <div className="flex items-center gap-3">
                                    <span className="material-symbols-outlined text-[20px]">group</span>
                                    CRM
                                </div>
                                <span className="material-symbols-outlined text-[16px]">chevron_right</span>
                            </div>
                        </div>
                        <div className="px-6 py-2 bg-slate-800/50">
                            <div className="flex items-center justify-between text-sm py-2 text-white font-medium">
                                <div className="flex items-center gap-3">
                                    <span className="material-symbols-outlined text-[20px]">directions_car</span>
                                    Estoque
                                </div>
                                <span className="material-symbols-outlined text-[16px]">expand_more</span>
                            </div>
                            <div className="ml-8 mt-2 flex flex-col gap-2 border-l border-slate-700 pl-4">
                                <a className="text-xs py-1.5 hover:text-white" href="#">Gerenciar estoque</a>
                                <a className="text-xs py-1.5 hover:text-white" href="#">Incluir veículo</a>
                                <a className="text-xs py-1.5 hover:text-white flex items-center gap-2" href="#">
                                    Incluir vistoriado 
                                    <span className="bg-primary text-[8px] text-white px-1 rounded uppercase font-bold">Novo</span>
                                </a>
                                <Link className={`text-xs py-1.5 flex items-center gap-2 font-bold ${location.pathname === '/studio' ? 'text-primary' : 'hover:text-white'}`} to="/studio">
                                    Estúdio
                                    <span className="bg-primary/20 text-primary text-[8px] px-1 rounded uppercase font-bold">Ativo</span>
                                </Link>
                                <a className="text-xs py-1.5 hover:text-white" href="#">Relatórios Estoque</a>
                            </div>
                        </div>
                        <div className="px-6 py-2">
                            <div className="flex items-center justify-between text-sm py-2 cursor-pointer hover:text-white">
                                <div className="flex items-center gap-3">
                                    <span className="material-symbols-outlined text-[20px]">bar_chart</span>
                                    Relatórios
                                </div>
                                <span className="material-symbols-outlined text-[16px]">chevron_right</span>
                            </div>
                        </div>
                        <div className="px-6 py-2">
                            <Link to="/" className="flex items-center gap-3 text-sm py-2 hover:text-white transition-colors">
                                <span className="material-symbols-outlined text-[20px]">grid_view</span>
                                Galeria
                            </Link>
                        </div>
                    </nav>
                </aside>
            );
        };

        const TopBar = ({ version = "standard" }) => {
            return (
                <header className={`${version === "slim" ? 'h-14' : 'h-16'} bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0 sticky top-0 z-40`}>
                    <div className="flex items-center gap-4">
                        {version === "slim" && (
                            <button className="lg:hidden p-2 text-slate-600">
                                <span className="material-symbols-outlined">menu</span>
                            </button>
                        )}
                        <h1 className={`${version === "slim" ? 'text-lg' : 'text-xl'} font-semibold text-slate-800`}>
                            Estúdio Webmotors
                        </h1>
                    </div>
                    <div className="flex items-center gap-6">
                        <button className="flex items-center gap-2 px-4 h-9 border border-slate-300 rounded-md text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
                            Acessar Revenda Mais
                            <span className="material-symbols-outlined text-[16px]">open_in_new</span>
                        </button>
                        <div className="flex items-center gap-3">
                            <button className="material-symbols-outlined text-slate-400 hover:text-slate-600">notifications</button>
                            {version === "slim" && <button className="p-2 text-slate-500 hover:text-primary"><span className="material-symbols-outlined text-xl">shopping_cart</span></button>}
                            <div className="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-xs font-bold text-slate-600">T</div>
                        </div>
                    </div>
                </header>
            );
        };

        const Footer = () => (
            <footer className="bg-[#f2f2f2] border-t border-slate-200 w-full py-4 mt-auto">
                <div className="max-w-[1200px] mx-auto px-8 flex justify-between items-center text-[10px] text-slate-500 font-medium">
                    <div className="flex gap-4">
                        <span>© 1995-2024 Webmotors S.A. Todos os direitos reservados.</span>
                    </div>
                    <div className="flex items-center gap-1">
                        <img alt="Webmotors" className="h-4 grayscale opacity-70" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAnz5tXoB_zWj9J_qG5fS_y6i7N5V-g1T0z9u6wYV_ZJ2n_HjK2w3W5g8hP9m0x8t=s0"/>
                        <span className="font-bold text-slate-400">webmotors</span>
                        <span className="mx-1">|</span>
                        <span className="text-[8px] flex items-center gap-1">UMA EMPRESA <img alt="Santander" className="h-3 grayscale opacity-70" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_v_ZJ_m8N-g_v5N-HjK2w3W5g8hP9m0x8t=s0"/> Santander</span>
                    </div>
                </div>
            </footer>
        );

        // --- Screen 1 Components ---

        const PhotoCard = ({ img, category, size }) => (
            <div className="bg-surface-container-lowest rounded-xl overflow-hidden shadow-sm group">
                <div className="relative aspect-[4/3] overflow-hidden">
                    <img alt={category} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src={img}/>
                    <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-start justify-end p-3">
                        <button className="w-8 h-8 rounded-full bg-white/90 flex items-center justify-center text-error shadow-lg">
                            <span className="material-symbols-outlined text-sm">delete</span>
                        </button>
                    </div>
                </div>
                <div className="p-4 flex justify-between items-center bg-surface-container-lowest">
                    <div className="flex flex-col">
                        <span className="text-xs font-bold text-outline uppercase mb-1">{category}</span>
                        <span className="text-xs text-slate-400">{size}</span>
                    </div>
                    <span className="material-symbols-outlined text-primary text-sm" style={{fontVariationSettings: "'FILL' 1"}}>check_circle</span>
                </div>
            </div>
        );

        const MAX_PHOTOS = 20;

        const formatFileSize = (bytes) => {
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        };

        const UploadScreen = () => {
            const navigate = useNavigate();
            const [photos, setPhotos] = React.useState([]);
            const [isDragging, setIsDragging] = React.useState(false);
            const [error, setError] = React.useState('');
            const fileInputRef = React.useRef(null);

            const processFiles = (files) => {
                setError('');
                const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
                const newFiles = Array.from(files).filter(f => validTypes.includes(f.type));
                if (newFiles.length === 0) { setError('Formato inválido. Use JPG, PNG ou WEBP.'); return; }
                const remaining = MAX_PHOTOS - photos.length;
                if (remaining <= 0) { setError('Limite de ' + MAX_PHOTOS + ' fotos atingido.'); return; }
                const toAdd = newFiles.slice(0, remaining);
                if (newFiles.length > remaining) setError('Apenas ' + remaining + ' foto(s) adicionada(s). Limite de ' + MAX_PHOTOS + ' atingido.');
                const readers = toAdd.map(file => new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve({ id: Date.now() + Math.random(), file, name: file.name, size: formatFileSize(file.size), preview: e.target.result });
                    reader.readAsDataURL(file);
                }));
                Promise.all(readers).then(newPhotos => setPhotos(prev => [...prev, ...newPhotos]));
            };

            const handleDrop = (e) => { e.preventDefault(); setIsDragging(false); processFiles(e.dataTransfer.files); };
            const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
            const handleDragLeave = () => setIsDragging(false);
            const removePhoto = (id) => { setPhotos(prev => prev.filter(p => p.id !== id)); setError(''); };
            const isFull = photos.length >= MAX_PHOTOS;
            const remaining = MAX_PHOTOS - photos.length;

            return (
                <div className="flex flex-1">
                    <Sidebar />
                    <div className="flex-1 flex flex-col min-w-0">
                        <TopBar />
                        <main className="flex-1 overflow-y-auto p-8 max-w-[1200px] mx-auto w-full">

                            {/* Stepper */}
                            <div className="flex items-center justify-center mb-16 gap-4">
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full signature-gradient flex items-center justify-center text-white text-xs font-bold shadow-lg shadow-primary/20">1</div>
                                    <span className="text-sm font-bold text-on-surface uppercase tracking-wider">UPLOAD</span>
                                </div>
                                <div className="w-16 h-[2px] bg-outline-variant/30"></div>
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface text-xs font-bold">2</div>
                                    <span className="text-sm font-bold text-outline uppercase tracking-wider">ESTÚDIO</span>
                                </div>
                                <div className="w-16 h-[2px] bg-outline-variant/30"></div>
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface text-xs font-bold">3</div>
                                    <span className="text-sm font-bold text-outline uppercase tracking-wider">DOWNLOAD</span>
                                </div>
                            </div>

                            {/* Drop Zone */}
                            <section className="w-full mb-4">
                                <div
                                    onDrop={handleDrop}
                                    onDragOver={handleDragOver}
                                    onDragLeave={handleDragLeave}
                                    onClick={() => !isFull && fileInputRef.current.click()}
                                    className={[
                                        "bg-surface-container-lowest rounded-xl p-12 flex flex-col items-center justify-center border-2 border-dashed transition-all duration-300 shadow-[0_8px_32px_-4px_rgba(106,105,119,0.05)]",
                                        isFull ? "border-outline-variant/30 opacity-60 cursor-not-allowed" :
                                        isDragging ? "border-primary bg-primary-fixed/30 cursor-copy scale-[1.01]" :
                                        "border-outline-variant/50 hover:border-primary/40 cursor-pointer group"
                                    ].join(' ')}
                                >
                                    <input ref={fileInputRef} type="file" accept="image/jpeg,image/png,image/webp" multiple className="hidden" onChange={(e) => processFiles(e.target.files)} />
                                    <div className={["w-20 h-20 rounded-full flex items-center justify-center mb-6 transition-colors duration-300", isDragging ? "bg-primary-fixed" : "bg-surface-container-low group-hover:bg-primary-fixed"].join(' ')}>
                                        <span className="material-symbols-outlined text-primary text-4xl" style={{fontVariationSettings: "'FILL' 1"}}>
                                            {isDragging ? "download" : "cloud_upload"}
                                        </span>
                                    </div>
                                    <h2 className="text-2xl font-bold mb-2 text-on-surface">
                                        {isDragging ? "Solte as fotos aqui" : "Adicionar fotos do veículo"}
                                    </h2>
                                    <p className="text-slate-500 mb-6 max-w-md text-center leading-relaxed">
                                        Arraste e solte ou clique para selecionar. Máximo de <strong className="text-on-surface">{MAX_PHOTOS} fotos</strong> por sessão.
                                    </p>
                                    {/* Progress dots */}
                                    <div className="flex items-center gap-3 mb-6">
                                        <div className="flex gap-1">
                                            {Array.from({length: MAX_PHOTOS}).map((_, i) => (
                                                <div key={i} className={["h-1.5 w-3 rounded-full transition-all", i < photos.length ? "bg-primary" : "bg-slate-200"].join(' ')}></div>
                                            ))}
                                        </div>
                                        <span className={["text-xs font-bold", isFull ? "text-error" : "text-slate-400"].join(' ')}>
                                            {photos.length}/{MAX_PHOTOS}
                                        </span>
                                    </div>
                                    {!isFull ? (
                                        <button className="px-8 h-12 rounded-lg bg-surface-container-highest text-on-surface font-semibold hover:bg-surface-dim active:scale-95 transition-all duration-300">
                                            Escolher fotos
                                        </button>
                                    ) : (
                                        <div className="px-6 h-10 rounded-lg bg-error/10 text-error text-sm font-semibold flex items-center gap-2">
                                            <span className="material-symbols-outlined text-[18px]">block</span>
                                            Limite atingido — remova fotos para adicionar novas
                                        </div>
                                    )}
                                    <div className="mt-4 flex gap-4 text-[10px] font-bold text-outline uppercase tracking-widest">
                                        <span>JPG</span><span>PNG</span><span>WEBP</span>
                                    </div>
                                </div>
                            </section>

                            {/* Error alert */}
                            {error && (
                                <div className="mb-6 flex items-center gap-3 px-4 py-3 bg-error-container text-on-error-container rounded-lg text-sm font-medium">
                                    <span className="material-symbols-outlined text-[18px]">warning</span>
                                    {error}
                                </div>
                            )}

                            {/* Photo grid */}
                            {photos.length > 0 && (
                                <section>
                                    <div className="flex items-end justify-between mb-6">
                                        <div>
                                            <h3 className="text-2xl font-black tracking-tighter uppercase mb-1">A COLEÇÃO</h3>
                                            <p className="text-slate-500 font-medium">
                                                {photos.length} {photos.length === 1 ? "imagem adicionada" : "imagens adicionadas"}
                                                {remaining > 0 && <span className="text-slate-400"> · ainda {remaining} disponível{remaining > 1 ? "is" : ""}</span>}
                                            </p>
                                        </div>
                                        <button onClick={() => { setPhotos([]); setError(''); }} className="text-xs text-slate-400 hover:text-error transition-colors font-medium flex items-center gap-1">
                                            <span className="material-symbols-outlined text-[16px]">delete_sweep</span>
                                            Remover todas
                                        </button>
                                    </div>
                                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-6">
                                        {photos.map((photo) => (
                                            <div key={photo.id} className="bg-surface-container-lowest rounded-xl overflow-hidden shadow-sm group">
                                                <div className="relative aspect-[4/3] overflow-hidden">
                                                    <img alt={photo.name} src={photo.preview} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                                    <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-start justify-end p-3">
                                                        <button onClick={(e) => { e.stopPropagation(); removePhoto(photo.id); }} className="w-8 h-8 rounded-full bg-white/90 flex items-center justify-center text-error shadow-lg hover:bg-white transition-colors">
                                                            <span className="material-symbols-outlined text-sm">delete</span>
                                                        </button>
                                                    </div>
                                                </div>
                                                <div className="p-4 flex justify-between items-center">
                                                    <div className="flex flex-col min-w-0">
                                                        <span className="text-xs font-bold text-on-surface truncate">{photo.name}</span>
                                                        <span className="text-xs text-slate-400">{photo.size}</span>
                                                    </div>

            // Compose car PNG over studio background using Canvas
            const composeWithBackground = (carPngUrl, bgImg) => {
                return new Promise((resolve) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1280;
                    canvas.height = 720;
                    const ctx = canvas.getContext('2d');

                    const bg = new Image();
                    bg.crossOrigin = 'anonymous';
                    bg.onload = () => {
                        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

                        const car = new Image();
                        car.onload = () => {
                            // Max area the car can occupy: 88% width, 70% height
                            var maxW = canvas.width * 0.88;
                            var maxH = canvas.height * 0.70;

                            // Scale to fit within max area preserving aspect ratio
                            var scaleW = maxW / car.width;
                            var scaleH = maxH / car.height;
                            var scale = Math.min(scaleW, scaleH);

                            var carW = car.width * scale;
                            var carH = car.height * scale;

                            // Center horizontally
                            var carX = (canvas.width - carW) / 2;

                            // Floor line sits at ~68% of canvas height
                            var floorY = canvas.height * 0.72;
                            var carY = floorY - carH;

                            // Reflection — subtle, fades out downward
                            var reflectH = carH * 0.35;
                            ctx.save();
                            ctx.globalAlpha = 0.15;
                            ctx.translate(carX, floorY);
                            ctx.scale(1, -1);
                            // clip reflection to a fixed height so it doesn't go too far
                            ctx.rect(0, 0, carW, reflectH);
                            ctx.clip();
                            ctx.drawImage(car, 0, 0, carW, carH);
                            ctx.restore();

                            // Draw car on top
                            ctx.globalAlpha = 1;
                            ctx.drawImage(car, carX, carY, carW, carH);

                            resolve(canvas.toDataURL('image/png'));
                        };
                        car.src = carPngUrl;
                    };
                    bg.src = bgImg;
                });
            };

                                <div className="text-center mb-8">
                                    <h2 className="text-2xl font-black text-on-surface mb-2">QUAL A PLACA DO VEÍCULO?</h2>
                                    <p className="text-sm text-slate-500">Vamos buscar todas as informações do carro automaticamente a partir da placa.</p>
                                </div>

                                <div className="space-y-4">
                                    <input
                                        type="text"
                                        value={placa}
                                        onChange={handleInput}
                                        placeholder="ABC1D23"
                                        maxLength={7}
                                        className="w-full h-16 text-center text-2xl font-black tracking-[0.3em] uppercase border-2 border-outline-variant rounded-xl focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 bg-white text-on-surface placeholder:text-slate-300 transition-all"
                                    />
                                    <p className="text-center text-xs text-slate-400">Formato ABC1234 ou ABC1D23 (Mercosul)</p>

                                    {erro && (
                                        <div className="flex items-center gap-2 px-4 py-3 bg-error-container text-on-error-container rounded-lg text-sm">
                                            <span className="material-symbols-outlined text-[16px]">warning</span>
                                            {erro}
                                        </div>
                                    )}

                                    <button
                                        onClick={handleBuscar}
                                        disabled={loading || placa.length < 7}
                                        className={["w-full h-14 font-bold rounded-xl text-sm tracking-widest uppercase transition-all flex items-center justify-center gap-2", loading || placa.length < 7 ? "bg-surface-container-highest text-slate-400 cursor-not-allowed" : "signature-gradient text-white shadow-lg hover:shadow-xl active:scale-[0.98] cursor-pointer"].join(' ')}
                                    >
                                        {loading ? (
                                            <React.Fragment>
                                                <svg className="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                                                </svg>
                                                Buscando dados...
                                            </React.Fragment>
                                        ) : (
                                            <React.Fragment>
                                                <span className="material-symbols-outlined">search</span>
                                                Buscar Dados do Veículo
                                            </React.Fragment>
                                        )}
                                    </button>

                                    <button
                                        onClick={() => navigate('/studio')}
                                        className="w-full py-3 text-xs text-slate-400 hover:text-primary transition-colors flex items-center justify-center gap-1"
                                    >
                                        <span className="material-symbols-outlined text-[16px]">arrow_back</span>
                                        Voltar ao Estúdio
                                    </button>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        // --- Anuncio Screen ---
        const AnuncioScreen = () => {
            const navigate = useNavigate();
            const [activeImg, setActiveImg] = React.useState(0);
            const [publicado, setPublicado] = React.useState(false);
            const [loading, setLoading] = React.useState(false);

            const vehicle = React.useState(() => {
                try { var d = sessionStorage.getItem('vehicleData'); return d ? JSON.parse(d) : null; } catch(e) { return null; }
            })[0];

            const processedImgs = React.useState(() => {
                try { var d = sessionStorage.getItem('studioProcessedImgs'); return d ? JSON.parse(d) : {}; } catch(e) { return {}; }
            })[0];

            const photos = React.useState(() => {
                try { var d = sessionStorage.getItem('studioPhotos'); return d ? JSON.parse(d) : []; } catch(e) { return []; }
            })[0];

            const allImgs = Object.values(processedImgs).length > 0
                ? Object.values(processedImgs)
                : photos.map(p => p.preview);

            // Generate smart description
            const gerarDescricao = (v) => {
                if (!v) return '';
                var itensDestaque = (v.itens || []).slice(0, 4).join(', ');
                return v.marca + ' ' + v.modelo + ' ' + v.versao + ' em excelente estado de conservação. ' +
                    'Veículo ' + (v.ano || '').split('/')[0] + ', ' + v.km + ' km rodados, câmbio ' + (v.cambio || '').toLowerCase() + ' e motor ' + (v.combustivel || '').toLowerCase() + '. ' +
                    (itensDestaque ? 'Itens de série: ' + itensDestaque + ' e muito mais. ' : '') +
                    'Revisões em dia, documentação ok. Financiamento facilitado, aceita troca. Entre em contato e agende seu test drive!';
            };

            const [form, setForm] = React.useState(() => vehicle ? {
                titulo: (vehicle.marca + ' ' + vehicle.modelo + ' ' + vehicle.versao).trim(),
                preco: vehicle.preco || '',
                km: vehicle.km || '',
                ano: vehicle.ano || '',
                cambio: vehicle.cambio || '',
                cor: vehicle.cor || '',
                carroceria: vehicle.carroceria || '',
                combustivel: vehicle.combustivel || '',
                portas: vehicle.portas || '',
                finalPlaca: vehicle.placa ? vehicle.placa.slice(-1) : '',
                cidade: (vehicle.cidade || '') + (vehicle.estado ? ' – ' + vehicle.estado : ''),
                descricao: gerarDescricao(vehicle),
            } : { descricao: '' });

            // Toggles — all off by default
            const [toggles, setToggles] = React.useState({
                unicoDono: false,
                ipvaPago: false,
                aceitaTroca: false,
                financiamento: false,
                garantiaFabrica: false,
                revisoesDia: false,
            });

            const toggleLabels = {
                unicoDono: { label: 'Único dono', icon: 'person' },
                ipvaPago: { label: 'IPVA pago', icon: 'receipt_long' },
                aceitaTroca: { label: 'Aceita troca', icon: 'swap_horiz' },
                financiamento: { label: 'Financiamento disponível', icon: 'account_balance' },
                garantiaFabrica: { label: 'Garantia de fábrica', icon: 'verified_user' },
                revisoesDia: { label: 'Revisões em dia', icon: 'build_circle' },
            };

            const setToggle = (k) => setToggles(p => ({ ...p, [k]: !p[k] }));
            const set = (k) => (e) => setForm(p => ({ ...p, [k]: e.target.value }));

            const handlePublicar = async () => {
                setLoading(true);
                await new Promise(r => setTimeout(r, 1800));
                setLoading(false);
                setPublicado(true);
            };

            // Toggle component
            const Toggle = ({ k }) => (
                <button
                    onClick={() => setToggle(k)}
                    className={["flex items-center gap-3 px-4 py-3 rounded-xl border-2 transition-all w-full text-left", toggles[k] ? "border-primary bg-primary/5" : "border-slate-100 bg-white hover:border-slate-200"].join(' ')}
                >
                    <span className={["material-symbols-outlined text-[20px]", toggles[k] ? "text-primary" : "text-slate-300"].join(' ')} style={toggles[k] ? {fontVariationSettings:"'FILL' 1"} : {}}>{toggleLabels[k].icon}</span>
                    <span className={["text-sm font-semibold flex-1", toggles[k] ? "text-primary" : "text-slate-400"].join(' ')}>{toggleLabels[k].label}</span>
                    <div className={["w-10 h-5 rounded-full transition-all relative flex-shrink-0", toggles[k] ? "bg-primary" : "bg-slate-200"].join(' ')}>
                        <div className={["absolute top-0.5 w-4 h-4 bg-white rounded-full shadow transition-all", toggles[k] ? "left-[22px]" : "left-0.5"].join(' ')}></div>
                    </div>
                </button>
            );

            if (publicado) {
                return (
                    <div className="flex min-h-screen items-center justify-center bg-[#F7F7F9]">
                        <div className="text-center p-8">
                            <div className="w-20 h-20 rounded-full signature-gradient flex items-center justify-center mx-auto mb-6 shadow-lg shadow-primary/30">
                                <span className="material-symbols-outlined text-white text-4xl" style={{fontVariationSettings:"'FILL' 1"}}>check_circle</span>
                            </div>
                            <h2 className="text-2xl font-black text-on-surface mb-2">Anúncio publicado!</h2>
                            <p className="text-slate-500 mb-8">Seu anúncio foi enviado com sucesso e está em revisão.</p>
                            <button onClick={() => navigate('/')} className="h-12 px-8 signature-gradient text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all">
                                Novo anúncio
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex min-h-screen bg-[#F7F7F9]">
                    <Sidebar version="collapsed" />
                    <div className="flex-1 flex flex-col">
                        <TopBar version="slim" />
                        {/* Stepper */}
                        <div className="flex items-center justify-center py-6 gap-4">
                            {['Upload','Estúdio','Anúncio'].map((s, i) => (
                                <React.Fragment key={s}>
                                    {i > 0 && <div className="w-12 h-[2px] bg-primary/40"></div>}
                                    <div className="flex items-center gap-2">
                                        <div className="w-7 h-7 rounded-full signature-gradient flex items-center justify-center text-white shadow-sm">
                                            {i < 2 ? <span className="material-symbols-outlined text-[16px]" style={{fontVariationSettings:"'FILL' 1"}}>check</span> : <span className="text-xs font-bold">3</span>}
                                        </div>
                                        <span className="text-xs font-bold text-primary uppercase tracking-wider">{s}</span>
                                    </div>
                                </React.Fragment>
                            ))}
                        </div>

                        {/* Preview banner */}
                        <div className="max-w-[900px] mx-auto w-full px-6 mb-4">
                            <div className="flex items-center gap-3 px-4 py-3 bg-amber-50 border border-amber-200 rounded-xl">
                                <span className="material-symbols-outlined text-amber-500 text-[20px]" style={{fontVariationSettings:"'FILL' 1"}}>visibility</span>
                                <div className="flex-1">
                                    <p className="text-xs font-black text-amber-700 uppercase tracking-wider">Preview do anúncio</p>
                                    <p className="text-xs text-amber-600">Revise e edite as informações antes de publicar. Clique em qualquer campo para alterar.</p>
                                </div>
                            </div>
                        </div>

                        <main className="max-w-[900px] mx-auto w-full px-6 pb-16 space-y-4">

                            {/* Photo carousel */}
                            {allImgs.length > 0 && (
                                <div>
                                    <div className="relative bg-surface-container-lowest rounded-2xl overflow-hidden aspect-[16/9] mb-3">
                                        <img src={allImgs[activeImg]} className="w-full h-full object-contain" alt="Foto do veículo" />
                                        {allImgs.length > 1 && (
                                            <React.Fragment>
                                                <button onClick={() => setActiveImg(i => Math.max(0, i-1))} className="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 flex items-center justify-center shadow-md hover:bg-white transition-all">
                                                    <span className="material-symbols-outlined text-on-surface text-lg">chevron_left</span>
                                                </button>
                                                <button onClick={() => setActiveImg(i => Math.min(allImgs.length-1, i+1))} className="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 flex items-center justify-center shadow-md hover:bg-white transition-all">
                                                    <span className="material-symbols-outlined text-on-surface text-lg">chevron_right</span>
                                                </button>
                                                <div className="absolute bottom-3 right-3 bg-on-surface/70 text-white text-xs font-bold px-2 py-1 rounded-full backdrop-blur-sm">{activeImg+1}/{allImgs.length}</div>
                                            </React.Fragment>
                                        )}
                                    </div>
                                    {allImgs.length > 1 && (
                                        <div className="flex gap-2 overflow-x-auto pb-1">
                                            {allImgs.map((img, i) => (
                                                <div key={i} onClick={() => setActiveImg(i)} className={["flex-shrink-0 w-20 h-14 rounded-lg overflow-hidden cursor-pointer border-2 transition-all", i === activeImg ? "border-primary" : "border-transparent opacity-60 hover:opacity-100"].join(' ')}>
                                                    <img src={img} className="w-full h-full object-cover" alt={"Foto " + (i+1)} />
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Titulo e preço */}
                            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                <div className="flex items-start gap-4 mb-1">
                                    <input
                                        value={form.titulo}
                                        onChange={set('titulo')}
                                        className="text-xl font-black text-primary flex-1 border-b-2 border-dashed border-slate-200 focus:border-primary outline-none bg-transparent pb-1 transition-colors"
                                    />
                                </div>
                                {vehicle && <p className="text-sm text-slate-400 mb-4">{vehicle.versao}</p>}
                                <div className="flex items-center justify-between flex-wrap gap-4">
                                    <div className="flex items-center gap-2">
                                        <span className="material-symbols-outlined text-[16px] text-slate-400" style={{fontVariationSettings:"'FILL' 1"}}>location_on</span>
                                        <input value={form.cidade} onChange={set('cidade')} className="text-sm text-slate-500 border-b border-dashed border-slate-200 focus:border-primary outline-none bg-transparent" />
                                    </div>
                                    <div className="text-right">
                                        <div className="flex items-center gap-2 justify-end mb-1">
                                            <span className="text-[10px] font-bold text-secondary uppercase tracking-wider bg-secondary/10 px-2 py-0.5 rounded-full flex items-center gap-1">
                                                <span className="material-symbols-outlined text-[12px]" style={{fontVariationSettings:"'FILL' 1"}}>stars</span>
                                                Valor sugerido
                                            </span>
                                        </div>
                                        <div className="flex items-center gap-1 justify-end">
                                            <span className="text-lg font-black text-on-surface">R$</span>
                                            <input value={form.preco} onChange={set('preco')} className="text-2xl font-black text-on-surface w-36 border-b-2 border-dashed border-slate-200 focus:border-primary outline-none bg-transparent text-right" />
                                        </div>
                                        <p className="text-[10px] text-slate-400 mt-0.5">Clique para editar o valor</p>
                                        {vehicle && vehicle.precoMin && vehicle.precoMax && (
                                            <p className="text-[10px] text-slate-400 mt-0.5">
                                                Faixa IWM: R$ {vehicle.precoMin} – R$ {vehicle.precoMax}
                                            </p>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Dados do veículo */}
                            {vehicle && (
                                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                    <div className="flex items-center justify-between mb-5">
                                        <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest">Dados do Veículo</h3>
                                        {vehicle.placa && (
                                            <span className="flex items-center gap-1.5 text-xs font-bold text-secondary bg-secondary/10 px-3 py-1 rounded-full">
                                                <span className="material-symbols-outlined text-[14px]" style={{fontVariationSettings:"'FILL' 1"}}>id_card</span>
                                                Placa {vehicle.placa} · Final {form.finalPlaca}
                                            </span>
                                        )}
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-y-5 gap-x-4">
                                        {[
                                            ['Ano', 'ano', 'calendar_month'],
                                            ['KM', 'km', 'speed'],
                                            ['Câmbio', 'cambio', 'settings'],
                                            ['Carroceria', 'carroceria', 'directions_car'],
                                            ['Cor', 'cor', 'palette'],
                                            ['Combustível', 'combustivel', 'local_gas_station'],
                                            ['Portas', 'portas', 'sensor_door'],
                                            ['Blindado', 'blindado', 'shield'],
                                        ].map(([label, key, icon]) => (
                                            <div key={key} className="flex items-start gap-2">
                                                <span className="material-symbols-outlined text-[16px] text-slate-300 mt-0.5">{icon}</span>
                                                <div className="flex-1 min-w-0">
                                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">{label}</p>
                                                    <input value={form[key] || ''} onChange={set(key)} className="text-sm font-semibold text-on-surface border-b border-dashed border-slate-200 focus:border-primary outline-none bg-transparent w-full" />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Características — toggles */}
                            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                <div className="flex items-center gap-2 mb-4">
                                    <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest">Características</h3>
                                    <span className="text-[10px] text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">Ative as que se aplicam</span>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    {Object.keys(toggleLabels).map(k => <Toggle key={k} k={k} />)}
                                </div>
                            </div>

                            {/* Itens do veículo */}
                            {vehicle && vehicle.itens && vehicle.itens.length > 0 && (
                                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                    <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Itens do Veículo</h3>
                                    <div className="flex flex-wrap gap-2">
                                        {vehicle.itens.map((item, i) => (
                                            <span key={i} className="px-3 py-1.5 bg-surface-container-low rounded-full text-xs font-medium text-on-surface border border-outline-variant/30">{item}</span>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Descrição */}
                            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest">Descrição do anúncio</h3>
                                    <span className="flex items-center gap-1 text-[10px] text-secondary font-bold bg-secondary/10 px-2 py-0.5 rounded-full">
                                        <span className="material-symbols-outlined text-[12px]" style={{fontVariationSettings:"'FILL' 1"}}>auto_awesome</span>
                                        Gerado automaticamente
                                    </span>
                                </div>
                                <textarea
                                    value={form.descricao}
                                    onChange={set('descricao')}
                                    rows={5}
                                    className="w-full text-sm text-slate-600 leading-relaxed border border-dashed border-slate-200 focus:border-primary rounded-xl p-4 outline-none bg-[#FAFAFA] focus:bg-white resize-none transition-all"
                                    placeholder="Descreva o veículo para o comprador..."
                                />
                                <p className="text-[10px] text-slate-400 mt-1">Edite o texto acima para personalizar sua descrição.</p>
                            </div>

                            {/* Actions */}
                            <div className="flex gap-3 pt-2">
                                <button onClick={() => navigate('/placa')} className="h-12 px-6 border-2 border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 transition-all flex items-center gap-2 text-sm">
                                    <span className="material-symbols-outlined text-[18px]">arrow_back</span>
                                    Voltar
                                </button>
                                <button
                                    onClick={handlePublicar}
                                    disabled={loading}
                                    className={["flex-1 h-12 font-bold rounded-xl text-sm transition-all flex items-center justify-center gap-2", loading ? "bg-slate-300 text-white cursor-not-allowed" : "signature-gradient text-white shadow-lg hover:shadow-xl active:scale-[0.98] cursor-pointer"].join(' ')}
                                >
                                    {loading ? (
                                        <React.Fragment>
                                            <svg className="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                                            </svg>
                                            Publicando...
                                        </React.Fragment>
                                    ) : (
                                        <React.Fragment>
                                            <span className="material-symbols-outlined">publish</span>
                                            Publicar Anúncio
                                        </React.Fragment>
                                    )}
                                </button>
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        // --- App Component ---

        const App = () => {
            return (
                <MemoryRouter>
                    <Routes>
                        <Route path="/" element={<UploadScreen />} />
                        <Route path="/studio" element={<StudioScreen />} />
                        <Route path="/placa" element={<PlacaScreen />} />
                        <Route path="/anuncio" element={<AnuncioScreen />} />
                    </Routes>
                </MemoryRouter>
            );
        };

        const rootElement = document.getElementById('root');
        const root = createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
