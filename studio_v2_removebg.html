    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        // --- In-memory store (avoids sessionStorage quota issues with large images) ---
        window.__studioStore = window.__studioStore || { photos: [], processedImgs: {} };

        // --- Shared Components ---

        const Sidebar = ({ version = "standard" }) => {

            if (version === "collapsed") {

                            </Link>
                            <div className="space-y-1">
                                <button className="w-full flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-white/10 transition-colors group">
                                    <span className="material-symbols-outlined mr-3 text-slate-400 group-hover:text-white">directions_car</span>
                                    <span className="hidden lg:block">Estoque</span>
                                    <span className="ml-auto hidden lg:block material-symbols-outlined text-xs text-slate-500 transition-transform rotate-90">chevron_right</span>
                                </button>
                                <div className="pl-9 space-y-1">
                                    <Link to="/studio" className={`flex items-center px-3 py-2 text-sm font-medium rounded-md group ${location.pathname === '/studio' ? 'bg-white/10 text-white' : 'hover:bg-white/10 text-slate-400'}`}>
                                        <span className="material-symbols-outlined mr-3 text-[18px]" style={{fontVariationSettings: "'FILL' 1"}}>precision_manufacturing</span>
                                        <span className="hidden lg:block">Estúdio</span>
                                    </Link>
                                    <Link to="/meus-videos" className={`flex items-center px-3 py-2 text-sm font-medium rounded-md group ${location.pathname === '/meus-videos' ? 'bg-white/10 text-white' : 'hover:bg-white/10 text-slate-400'}`}>
                                        <span className="material-symbols-outlined mr-3 text-[18px]" style={{fontVariationSettings: "'FILL' 1"}}>video_library</span>
                                        <span className="hidden lg:block">Meus Vídeos</span>
                                    </Link>
                                </div>
                            </div>
                        </nav>
                        <div className="p-4 border-t border-white/5">
                            <a href="#" className="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-white/10 transition-colors group">
                                <span className="material-symbols-outlined mr-3 text-slate-400 group-hover:text-white">settings</span>
                                <span className="hidden lg:block">Configurações</span>
                            </a>

            }

            return (
                <aside className="w-64 sidebar-dark text-slate-400 flex flex-col shrink-0">
                    <div className="h-16 flex items-center px-6 border-b border-slate-800">
                        <div className="flex items-center gap-2">
                            <span className="material-symbols-outlined text-white text-2xl" style={{fontVariationSettings: "'FILL' 1"}}>speed</span>
                            <span className="text-white font-bold text-lg tracking-tight">Cockpit</span>
                            <span className="material-symbols-outlined text-white/60 text-sm ml-auto">notifications</span>
                        </div>
                    </div>
                    <nav className="flex-1 py-4 overflow-y-auto">
                        <div className="px-6 py-2">
                            <Link to="/" className="flex items-center gap-3 text-sm py-2 hover:text-white transition-colors">
                                <span className="material-symbols-outlined text-[20px]">home</span>
                                Início
                            </Link>
                        </div>
                        <div className="px-6 py-2">
                            <div className="flex items-center justify-between text-sm py-2 cursor-pointer hover:text-white group">
                                <div className="flex items-center gap-3">
                                    <span className="material-symbols-outlined text-[20px]">group</span>
                                    CRM
                                </div>
                                <span className="material-symbols-outlined text-[16px]">chevron_right</span>
                            </div>
                        </div>
                        <div className="px-6 py-2 bg-slate-800/50">
                            <div className="flex items-center justify-between text-sm py-2 text-white font-medium">
                                <div className="flex items-center gap-3">
                                    <span className="material-symbols-outlined text-[20px]">directions_car</span>
                                    Estoque
                                </div>
                                <span className="material-symbols-outlined text-[16px]">expand_more</span>
                            </div>
                            <div className="ml-8 mt-2 flex flex-col gap-2 border-l border-slate-700 pl-4">
                                <a className="text-xs py-1.5 hover:text-white" href="#">Gerenciar estoque</a>
                                <a className="text-xs py-1.5 hover:text-white" href="#">Incluir veículo</a>
                                <a className="text-xs py-1.5 hover:text-white flex items-center gap-2" href="#">
                                    Incluir vistoriado 
                                    <span className="bg-primary text-[8px] text-white px-1 rounded uppercase font-bold">Novo</span>
                                </a>
                                <Link className={`text-xs py-1.5 flex items-center gap-2 font-bold ${location.pathname === '/studio' ? 'text-primary' : 'hover:text-white'}`} to="/studio">
                                    Estúdio
                                    <span className="bg-primary/20 text-primary text-[8px] px-1 rounded uppercase font-bold">Ativo</span>
                                </Link>
                                <Link className={`text-xs py-1.5 flex items-center gap-2 font-bold ${location.pathname === '/meus-videos' ? 'text-[#7c3aed]' : 'hover:text-white'}`} to="/meus-videos">
                                    Meus Vídeos
                                    <span className="material-symbols-outlined text-[12px]" style={{fontVariationSettings:"'FILL' 1"}}>video_library</span>
                                </Link>
                                <a className="text-xs py-1.5 hover:text-white" href="#">Relatórios Estoque</a>
                            </div>
                        </div>
                        <div className="px-6 py-2">
                            <div className="flex items-center justify-between text-sm py-2 cursor-pointer hover:text-white">
                                <div className="flex items-center gap-3">
                                    <span className="material-symbols-outlined text-[20px]">bar_chart</span>
                                    Relatórios
                                </div>
                                <span className="material-symbols-outlined text-[16px]">chevron_right</span>
                            </div>
                        </div>
                        <div className="px-6 py-2">
                            <Link to="/" className="flex items-center gap-3 text-sm py-2 hover:text-white transition-colors">
                                <span className="material-symbols-outlined text-[20px]">grid_view</span>
                                Galeria
                            </Link>
                        </div>
                    </nav>
                </aside>
            );
        };

        const TopBar = ({ version = "standard" }) => {
            return (
                <header className={`${version === "slim" ? 'h-14' : 'h-16'} bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0 sticky top-0 z-40`}>
                    <div className="flex items-center gap-4">
                        {version === "slim" && (
                            <button className="lg:hidden p-2 text-slate-600">
                                <span className="material-symbols-outlined">menu</span>
                            </button>
                        )}
                        <h1 className={`${version === "slim" ? 'text-lg' : 'text-xl'} font-semibold text-slate-800`}>
                            Estúdio Webmotors
                        </h1>
                    </div>
                    <div className="flex items-center gap-6">
                        <button className="flex items-center gap-2 px-4 h-9 border border-slate-300 rounded-md text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
                            Acessar Revenda Mais
                            <span className="material-symbols-outlined text-[16px]">open_in_new</span>
                        </button>
                        <div className="flex items-center gap-3">
                            <button className="material-symbols-outlined text-slate-400 hover:text-slate-600">notifications</button>
                            {version === "slim" && <button className="p-2 text-slate-500 hover:text-primary"><span className="material-symbols-outlined text-xl">shopping_cart</span></button>}
                            <div className="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-xs font-bold text-slate-600">T</div>
                        </div>
                    </div>
                </header>
            );
        };

        const Footer = () => (
            <footer className="bg-[#f2f2f2] border-t border-slate-200 w-full py-4 mt-auto">
                <div className="max-w-[1200px] mx-auto px-8 flex justify-between items-center text-[10px] text-slate-500 font-medium">
                    <div className="flex gap-4">
                        <span>© 1995-2024 Webmotors S.A. Todos os direitos reservados.</span>
                    </div>
                    <div className="flex items-center gap-1">
                        <img alt="Webmotors" className="h-4 grayscale opacity-70" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAnz5tXoB_zWj9J_qG5fS_y6i7N5V-g1T0z9u6wYV_ZJ2n_HjK2w3W5g8hP9m0x8t=s0"/>
                        <span className="font-bold text-slate-400">webmotors</span>
                        <span className="mx-1">|</span>
                        <span className="text-[8px] flex items-center gap-1">UMA EMPRESA <img alt="Santander" className="h-3 grayscale opacity-70" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_v_ZJ_m8N-g_v5N-HjK2w3W5g8hP9m0x8t=s0"/> Santander</span>
                    </div>
                </div>
            </footer>
        );

        // --- Screen 1 Components ---

        const PhotoCard = ({ img, category, size }) => (
            <div className="bg-surface-container-lowest rounded-xl overflow-hidden shadow-sm group">
                <div className="relative aspect-[4/3] overflow-hidden">
                    <img alt={category} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src={img}/>
                    <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-start justify-end p-3">
                        <button className="w-8 h-8 rounded-full bg-white/90 flex items-center justify-center text-error shadow-lg">
                            <span className="material-symbols-outlined text-sm">delete</span>
                        </button>
                    </div>
                </div>
                <div className="p-4 flex justify-between items-center bg-surface-container-lowest">
                    <div className="flex flex-col">
                        <span className="text-xs font-bold text-outline uppercase mb-1">{category}</span>
                        <span className="text-xs text-slate-400">{size}</span>
                    </div>
                    <span className="material-symbols-outlined text-primary text-sm" style={{fontVariationSettings: "'FILL' 1"}}>check_circle</span>
                </div>
            </div>
        );

        const MAX_PHOTOS = 20;

        const formatFileSize = (bytes) => {
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        };

        const UploadScreen = () => {
            const navigate = useNavigate();
            const [photos, setPhotos] = React.useState([]);
            const [isDragging, setIsDragging] = React.useState(false);
            const [error, setError] = React.useState('');
            const fileInputRef = React.useRef(null);

            const processFiles = (files) => {
                setError('');
                const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
                const newFiles = Array.from(files).filter(f => validTypes.includes(f.type));
                if (newFiles.length === 0) { setError('Formato inválido. Use JPG, PNG ou WEBP.'); return; }
                const remaining = MAX_PHOTOS - photos.length;
                if (remaining <= 0) { setError('Limite de ' + MAX_PHOTOS + ' fotos atingido.'); return; }
                const toAdd = newFiles.slice(0, remaining);
                if (newFiles.length > remaining) setError('Apenas ' + remaining + ' foto(s) adicionada(s). Limite de ' + MAX_PHOTOS + ' atingido.');
                const readers = toAdd.map(file => new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve({ id: Date.now() + Math.random(), file, name: file.name, size: formatFileSize(file.size), preview: e.target.result });
                    reader.readAsDataURL(file);
                }));
                Promise.all(readers).then(newPhotos => setPhotos(prev => [...prev, ...newPhotos]));
            };

            const handleDrop = (e) => { e.preventDefault(); setIsDragging(false); processFiles(e.dataTransfer.files); };
            const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
            const handleDragLeave = () => setIsDragging(false);
            const removePhoto = (id) => { setPhotos(prev => prev.filter(p => p.id !== id)); setError(''); };
            const isFull = photos.length >= MAX_PHOTOS;
            const remaining = MAX_PHOTOS - photos.length;

            return (
                <div className="flex min-h-screen" style={{background: 'var(--ds-bg-page)'}}>
                    {/* Sidebar — hidden on mobile */}
                    <div className="hidden md:flex">
                        <Sidebar className="hidden md:flex" />
                    </div>

                    <div className="flex-1 flex flex-col min-w-0">
                        <TopBar />

                        <main className="flex-1 overflow-y-auto w-full max-w-[1440px] mx-auto px-4 md:px-8 lg:px-[72px] py-6 md:py-8">

                            {/* Stepper DS */}
                            <div className="flex items-center justify-center mb-8 md:mb-12 gap-3 md:gap-4">
                                {[{n:1,label:'Upload',active:true},{n:2,label:'Estúdio',active:false},{n:3,label:'Download',active:false}].map((s, idx) => (
                                    <React.Fragment key={s.n}>
                                        <div className="flex items-center gap-2">
                                            <div className={[
                                                "w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold leading-[140%] transition-all",
                                                s.active ? "wm-gradient text-white shadow-[0_8px_8px_rgba(106,105,119,0.08)]" : "text-[#2F2F32]"
                                            ].join(' ')} style={!s.active ? {background:'var(--ds-bg-section)'} : {}}>
                                                {s.active ? <span className="material-symbols-outlined text-[16px]" style={{fontVariationSettings:"'FILL' 1"}}>check</span> : s.n}
                                            </div>
                                            <span className={["hidden sm:inline text-[12px] font-semibold uppercase tracking-widest leading-[140%]", s.active ? "text-[#E22446]" : "text-[#4A4B77]"].join(' ')}>{s.label}</span>
                                        </div>
                                        {idx < 2 && <div className="w-10 md:w-16 h-[2px] rounded-full" style={{background:'var(--ds-border-default)'}}></div>}
                                    </React.Fragment>
                                ))}
                            </div>

                            {/* Drop Zone */}
                            <section className="w-full mb-4">
                                <div
                                    onDrop={handleDrop}
                                    onDragOver={handleDragOver}
                                    onDragLeave={handleDragLeave}
                                    onClick={() => !isFull && fileInputRef.current.click()}
                                    className={["rounded-[16px] p-8 md:p-12 flex flex-col items-center justify-center border-2 border-dashed transition-all duration-300", isFull ? "opacity-60 cursor-not-allowed" : isDragging ? "cursor-copy scale-[1.01]" : "cursor-pointer"].join(' ')}
                                    style={{
                                        background: isDragging ? 'rgba(226,36,70,0.04)' : 'var(--ds-bg-card)',
                                        borderColor: isDragging ? 'var(--ds-brand-primary)' : isFull ? 'var(--ds-border-default)' : 'var(--ds-border-default)',
                                        boxShadow: 'var(--shadow-ds-level-1)'
                                    }}
                                >
                                    <input ref={fileInputRef} type="file" accept="image/jpeg,image/png,image/webp" multiple className="hidden" onChange={(e) => processFiles(e.target.files)} />

                                    {/* Icon */}
                                    <div className="w-16 h-16 md:w-20 md:h-20 rounded-full flex items-center justify-center mb-6 transition-all"
                                        style={{background: isDragging ? 'rgba(226,36,70,0.1)' : 'var(--ds-bg-page)'}}>
                                        <span className="material-symbols-outlined text-3xl md:text-4xl" style={{color:'var(--ds-brand-primary)', fontVariationSettings:"'FILL' 1"}}>
                                            {isDragging ? "download" : "cloud_upload"}
                                        </span>
                                    </div>

                                    <h2 className="text-[20px] font-bold mb-2 text-center leading-[130%]" style={{color:'var(--ds-neutral-low-darker, #2F2F32)'}}>
                                        {isDragging ? "Solte as fotos aqui" : "Adicionar fotos do veículo"}
                                    </h2>
                                    <p className="text-[14px] leading-[140%] mb-6 max-w-sm text-center" style={{color:'var(--ds-text-secondary)'}}>
                                        Arraste e solte ou clique para selecionar. Máximo de <strong style={{color:'var(--ds-neutral-low-darker, #2F2F32)'}}>{MAX_PHOTOS} fotos</strong> por sessão.
                                    </p>

                                    {/* Progress bar DS */}

        };

        // --- Screen 2 Components ---


        const StudioScreen = () => {
            const navigate = useNavigate();

            const [selectedTemplate, setSelectedTemplate] = React.useState(0);
            const [activePhoto, setActivePhoto] = React.useState(0);

            const [processingAll, setProcessingAll] = React.useState(false);
            const [processingAllProgress, setProcessingAllProgress] = React.useState({ current: 0, total: 0 });
            const [processedImgs, setProcessedImgs] = React.useState({});
            const [error, setError] = React.useState('');
            const [videoTaskId, setVideoTaskId] = React.useState(null);
            const [videoStatus, setVideoStatus] = React.useState(null); // null | 'generating' | 'succeeded' | 'failed'
            const [videoUrl, setVideoUrl] = React.useState(null);
            const videoPollingRef = React.useRef(null);
            const isDraggingSlider = React.useRef(false);

            // Use photos from upload screen via in-memory store
            const [photos] = React.useState(() => window.__studioStore.photos || []);

            const STUDIO_TEMPLATE = "/estudio_infinity_white.jpg";

            const templates = [
                { id: 0, name: "Estúdio Branco", uses: "3.2k USOS", bg: "#f0f0f0", studioImg: null, isEstudioBranco: true, img: "https://raw.githubusercontent.com/tigo30009/Studio/main/Fundo_estudio_1.jpeg" },
                { id: 1, name: "Bytedance", uses: "1.8k USOS", bg: "#8a8a8a", studioImg: null, isBytedance: true, img: "https://lh3.googleusercontent.com/aida-public/AB6AXuDPqX9l8rCgEaJNsDcIVqX7j8vU_nUeqC0g08g69aE4J317qWGWnVyj0MjR9-zGzT8OvfsvTttGK_A4_rc3biQiQPIwjXpZPw9dNNlZZZJC9ykD7CJ6PSTI_-A-x6gfWo2Wa1J2bJ3WT6OI2RkirG_ToGvLn8nTAHliKEc6oeqGYqr5WDQPl8yS0plz7-wdWXWPUNOKBsArcUifeXK3dX_AtFTA83rqq4ibGC1rmZpcLGs550xMxmsDzGuMPpC0eEPh029_XV6lbJg" },
                { id: 2, name: "Midnight Onyx", uses: "942 USOS", bg: "#1a1a2e", studioImg: null, img: "https://lh3.googleusercontent.com/aida-public/AB6AXuAGdi8qIED4qmgJH0rcg_FQaJ4xwMiCRh9gABhxqZECFtn_7Rw3Ic9IskgPTlzcv0vBBD9LtbqqQAvDqsUNbZ7mcoy9m3Mr-YLY10312_UTXNq0F1WFjL72d6Z8sXmHp-WN3N9a7rbRzCgINx63QOiOYZcCFV9A5btemaMbA7b7jEzSe6S5kEnCWOa64Zg7N31A1r8WA-8QTPDf4Ygpc6otUDrTAN7dmkk0_dSLp2GUvSI08etrAJp1mH7GOe1sJyfC7pznyVDCcyI", comingSoon: true },
                { id: 3, name: "360 Dinâmico", uses: "VÍDEO", bg: "#222", studioImg: null, img: "https://lh3.googleusercontent.com/aida-public/AB6AXuDdZpv0pBrSD-tnSXiDAHYi1hbKfOaXIiV1q1RgSD1JfBU8ConkdhVxJYmiKM8lhpN4JzYxXyp0LGi4niYz2OrECaON7fb-YpWsGn1Mrt1UO0UYubZnx9NXQazpyDphoYtV6I7T7w_I-MuxGnWBu2BWnvsIImoHeg-wgZBeLI4GECCpKa_qkb3xqPND31AfvmukBAimrex_sP1guMbn7NU8pubLg3FpyhCm-wPe3mLWl0IZtVh-JSi9jpKOJHFG2Vv6N4uiVNvJQBk", isVideo: true, comingSoon: true },
                { id: 4, name: "Redes Sociais", uses: "NOVO", bg: "#0f0f1a", studioImg: null, img: "https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=400&q=80", isSocialVideo: true },
            ];

            const currentPhoto = photos[activePhoto];
            const currentProcessed = processedImgs[activePhoto];
            const beforeSrc = currentPhoto ? currentPhoto.preview : "https://lh3.googleusercontent.com/aida-public/AB6AXuAJdRwqlyvSUZKfFJrYVpdf-K5NMIFH3UCPy7fcWgbACW_XSxOzz1IIgQee3pdl0Ny2VohEEr25bFZ8kywOzPITH2SoOhxn5wXwxIRtnRQuG2oWhgCWsAI79ZJWyRBTNTZAx-OdXf0Xhh6WGHtADnM-3hHl4IQEoJuPc6QfrLit0Q4juGVUvtgs9QWPkhguJjXAUoJhr_xoecJa001-NP9qvJqPnR80xALB6UigoSP_2uL8mYdTvp6HB5xdmMOsVnu1202ZLhrqPl0";
            const afterSrc = currentProcessed || null;

            const sliderRef = React.useRef(null);
            const isDragging = React.useRef(false);

            const getSliderPercent = (clientX) => {
                const rect = sliderRef.current.getBoundingClientRect();
                const x = clientX - rect.left;
                return Math.min(Math.max((x / rect.width) * 100, 0), 100);
            };

            const handleSliderMouseDown = (e) => {
                e.preventDefault();
                isDragging.current = true;
                setSliderPos(getSliderPercent(e.clientX));
            };

            const handleSliderTouchStart = (e) => {
                isDragging.current = true;
                setSliderPos(getSliderPercent(e.touches[0].clientX));
            };

            React.useEffect(() => {
                const onMouseMove = (e) => {
                    if (!isDragging.current) return;
                    setSliderPos(getSliderPercent(e.clientX));
                };
                const onMouseUp = () => { isDragging.current = false; };
                const onTouchMove = (e) => {
                    if (!isDragging.current) return;
                    e.preventDefault();
                    setSliderPos(getSliderPercent(e.touches[0].clientX));
                };
                const onTouchEnd = () => { isDragging.current = false; };

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
                window.addEventListener('touchmove', onTouchMove, { passive: false });
                window.addEventListener('touchend', onTouchEnd);
                return () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                    window.removeEventListener('touchmove', onTouchMove);
                    window.removeEventListener('touchend', onTouchEnd);
                };
            }, []);

            // Compose car PNG over studio background using Canvas
            const composeWithBackground = (carPngUrl, bgImg) => {
                return new Promise((resolve) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1280;
                    canvas.height = 720;
                    const ctx = canvas.getContext('2d');

                    const bg = new Image();
                    bg.crossOrigin = 'anonymous';
                    bg.onload = () => {
                        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

                        const car = new Image();
                        car.onload = () => {
                            // Max area the car can occupy: 88% width, 70% height
                            var maxW = canvas.width * 0.88;
                            var maxH = canvas.height * 0.70;

                            // Scale to fit within max area preserving aspect ratio
                            var scaleW = maxW / car.width;
                            var scaleH = maxH / car.height;
                            var scale = Math.min(scaleW, scaleH);

                            var carW = car.width * scale;
                            var carH = car.height * scale;

                            // Center horizontally
                            var carX = (canvas.width - carW) / 2;

                            // Floor line sits at ~68% of canvas height
                            var floorY = canvas.height * 0.72;
                            var carY = floorY - carH;

                            // Reflection — subtle, fades out downward
                            var reflectH = carH * 0.35;
                            ctx.save();
                            ctx.globalAlpha = 0.15;
                            ctx.translate(carX, floorY);
                            ctx.scale(1, -1);
                            // clip reflection to a fixed height so it doesn't go too far
                            ctx.rect(0, 0, carW, reflectH);
                            ctx.clip();
                            ctx.drawImage(car, 0, 0, carW, carH);
                            ctx.restore();

                            // Draw car on top
                            ctx.globalAlpha = 1;
                            ctx.drawImage(car, carX, carY, carW, carH);

                            resolve(canvas.toDataURL('image/png'));
                        };
                        car.src = carPngUrl;
                    };
                    bg.src = bgImg;
                });
            };

            const processPhoto = async () => {
                if (!currentPhoto) return;
                setProcessing(true);
                setError('');
                try {
                    var template = templates[selectedTemplate];

                    const toBlob = (photo) => {
                        const base64 = photo.preview;
                        const byteString = atob(base64.split(',')[1]);
                        const mimeType = base64.split(',')[0].split(':')[1].split(';')[0];
                        const ab = new ArrayBuffer(byteString.length);
                        const ia = new Uint8Array(ab);
                        for (var i = 0; i < byteString.length; i++) { ia[i] = byteString.charCodeAt(i); }
                        return new Blob([ab], { type: mimeType });
                    };

                    if (template.isEstudioBranco) {
                        // --- Estúdio Branco (Bytedance com fundo referenciado) ---
                        const uploadForm = new FormData();
                        uploadForm.append('image', toBlob(currentPhoto), currentPhoto.name || 'photo.jpg');
                        const res = await fetch('https://studio-xefd.onrender.com/estudio-branco-bg', { method: 'POST', body: uploadForm });
                        if (!res.ok) { var e = await res.json().catch(() => ({})); throw new Error(e.error || 'Erro Estúdio Branco (status ' + res.status + ')'); }
                        const data = await res.json();
                        const imageUrl = data.data && data.data[0] && data.data[0].url;
                        if (!imageUrl) throw new Error('Bytedance não retornou imagem.');
                        setProcessedImgs(prev => ({ ...prev, [activePhoto]: imageUrl }));
                        setSliderPos(50);

                    } else if (template.isBytedance) {
                        // --- Bytedance Seedream flow ---
                        const uploadForm = new FormData();
                        uploadForm.append('image', toBlob(currentPhoto), currentPhoto.name || 'photo.jpg');
                        const res = await fetch('https://studio-xefd.onrender.com/bytedance-bg', { method: 'POST', body: uploadForm });
                        if (!res.ok) { var errData = await res.json().catch(() => ({})); throw new Error(errData.error || 'Erro ao processar imagem Bytedance (status ' + res.status + ')'); }
                        const data = await res.json();
                        const imageUrl = data.data && data.data[0] && data.data[0].url;
                        if (!imageUrl) throw new Error('Bytedance não retornou imagem.');
                        setProcessedImgs(prev => ({ ...prev, [activePhoto]: imageUrl }));
                        setSliderPos(50);

                    } else {
                        // --- Remove.bg flow (original) ---
                        const base64 = currentPhoto.preview;
                        const byteString = atob(base64.split(',')[1]);
                        const mimeType = base64.split(',')[0].split(':')[1].split(';')[0];
                        const ab = new ArrayBuffer(byteString.length);
                        const ia = new Uint8Array(ab);
                        for (var i = 0; i < byteString.length; i++) { ia[i] = byteString.charCodeAt(i); }
                        const blob = new Blob([ab], { type: mimeType });

                        const formData = new FormData();
                        formData.append('image', blob, currentPhoto.name || 'photo.jpg');

                        const res = await fetch('https://studio-xefd.onrender.com/remove-bg', {
                            method: 'POST',
                            body: formData
                        });

                        if (!res.ok) {
                            var errData = await res.json().catch(() => ({}));
                            throw new Error((errData.errors && errData.errors[0] && errData.errors[0].title) || 'Erro ao processar imagem (status ' + res.status + ')');
                        }

                        const resultBlob = await res.blob();
                        const carPngUrl = URL.createObjectURL(resultBlob);
                        var finalUrl = carPngUrl;
                        if (template.studioImg) {
                            finalUrl = await composeWithBackground(carPngUrl, template.studioImg);
                        }
                        setProcessedImgs(prev => ({ ...prev, [activePhoto]: finalUrl }));
                        setSliderPos(50);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setProcessing(false);
                }
            };

            const processAllPhotos = async () => {
                if (photos.length === 0) return;
                setProcessingAll(true);
                setError('');
                const template = templates[selectedTemplate];
                const total = photos.length;
                setProcessingAllProgress({ current: 0, total });

                for (var idx = 0; idx < photos.length; idx++) {
                    const photo = photos[idx];
                    setProcessingAllProgress({ current: idx + 1, total });
                    try {
                        const base64 = photo.preview;
                        const byteString = atob(base64.split(',')[1]);
                        const mimeType = base64.split(',')[0].split(':')[1].split(';')[0];
                        const ab = new ArrayBuffer(byteString.length);
                        const ia = new Uint8Array(ab);
                        for (var i = 0; i < byteString.length; i++) { ia[i] = byteString.charCodeAt(i); }
                        const blob = new Blob([ab], { type: mimeType });

                        if (template.isEstudioBranco) {
                            const uploadForm = new FormData();
                            uploadForm.append('image', blob, photo.name || 'photo.jpg');
                            const res = await fetch('https://studio-xefd.onrender.com/estudio-branco-bg', { method: 'POST', body: uploadForm });
                            if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || 'Erro Estúdio Branco foto ' + (idx+1)); }
                            const data = await res.json();
                            const imageUrl = data.data && data.data[0] && data.data[0].url;
                            if (!imageUrl) throw new Error('Bytedance não retornou imagem para foto ' + (idx+1));
                            setProcessedImgs(prev => ({ ...prev, [idx]: imageUrl }));
                        } else if (template.isBytedance) {
                            const uploadForm = new FormData();
                            uploadForm.append('image', blob, photo.name || 'photo.jpg');
                            const res = await fetch('https://studio-xefd.onrender.com/bytedance-bg', { method: 'POST', body: uploadForm });
                            if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || 'Erro Bytedance foto ' + (idx+1)); }
                            const data = await res.json();
                            const imageUrl = data.data && data.data[0] && data.data[0].url;
                            if (!imageUrl) throw new Error('Bytedance não retornou imagem para foto ' + (idx+1));
                            setProcessedImgs(prev => ({ ...prev, [idx]: imageUrl }));
                        } else {
                            const formData = new FormData();
                            formData.append('image', blob, photo.name || 'photo.jpg');
                            const res = await fetch('https://studio-xefd.onrender.com/remove-bg', { method: 'POST', body: formData });
                            if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error((e.errors && e.errors[0] && e.errors[0].title) || 'Erro Remove.bg foto ' + (idx+1)); }
                            const resultBlob = await res.blob();
                            const carPngUrl = URL.createObjectURL(resultBlob);
                            var finalUrl = carPngUrl;
                            if (template.studioImg) { finalUrl = await composeWithBackground(carPngUrl, template.studioImg); }
                            setProcessedImgs(prev => ({ ...prev, [idx]: finalUrl }));
                        }
                    } catch (err) {
                        setError('Foto ' + (idx+1) + ': ' + err.message);
                        // continue processing remaining photos
                    }
                }
                setProcessingAll(false);
                setProcessingAllProgress({ current: 0, total: 0 });
                setActivePhoto(0);
                setSliderPos(50);
            };

            // ── Video localStorage helpers ──────────────────────────────────
            const VIDEOS_KEY = 'wm_studio_videos';
            const loadVideos = () => { try { return JSON.parse(localStorage.getItem(VIDEOS_KEY) || '[]'); } catch(e) { return []; } };
            const saveVideos = (list) => { try { localStorage.setItem(VIDEOS_KEY, JSON.stringify(list)); } catch(e) {} };

            const generateSocialVideo = async () => {
                if (photos.length === 0) return;
                setVideoStatus('generating');
                setVideoUrl(null);
                setVideoTaskId(null);
                setError('');

                try {
                    const formData = new FormData();
                    for (var i = 0; i < photos.length; i++) {
                        const photo = photos[i];
                        const base64 = photo.preview;
                        const byteString = atob(base64.split(',')[1]);
                        const mimeType = base64.split(',')[0].split(':')[1].split(';')[0];
                        const ab = new ArrayBuffer(byteString.length);
                        const ia = new Uint8Array(ab);
                        for (var j = 0; j < byteString.length; j++) { ia[j] = byteString.charCodeAt(j); }
                        const blob = new Blob([ab], { type: mimeType });
                        formData.append('images', blob, photo.name || ('foto_' + (i+1) + '.jpg'));
                    }

                    const res = await fetch('https://studio-xefd.onrender.com/generate-video', { method: 'POST', body: formData });
                    if (!res.ok) {
                        const e = await res.json().catch(() => ({}));
                        throw new Error(e.error || 'Erro ao iniciar geração de vídeo.');
                    }

                    const data = await res.json();
                    const taskId = data.task_id;
                    setVideoTaskId(taskId);

                    // Save to localStorage
                    const thumbnail = photos[0] ? photos[0].preview : null;
                    const existing = loadVideos();
                    saveVideos([{ task_id: taskId, created_at: new Date().toISOString(), status: 'generating', video_url: null, thumbnail }, ...existing]);

                    // Start polling
                    const poll = async () => {
                        try {
                            const statusRes = await fetch('https://studio-xefd.onrender.com/video-status/' + taskId);
                            const statusData = await statusRes.json();
                            const s = statusData.status;
                            if (s === 'succeeded' && statusData.video_url) {
                                setVideoStatus('succeeded');
                                setVideoUrl(statusData.video_url);
                                clearInterval(videoPollingRef.current);
                                // Update localStorage
                                const updated = loadVideos().map(v => v.task_id === taskId ? { ...v, status: 'succeeded', video_url: statusData.video_url } : v);
                                saveVideos(updated);
                            } else if (s === 'failed') {

                                        <div className="flex items-center gap-2 justify-end mb-1">
                                            <span className="text-[10px] font-bold text-secondary uppercase tracking-wider bg-secondary/10 px-2 py-0.5 rounded-full flex items-center gap-1">
                                                <span className="material-symbols-outlined text-[12px]" style={{fontVariationSettings:"'FILL' 1"}}>stars</span>
                                                Valor sugerido
                                            </span>
                                        </div>
                                        <div className="flex items-center gap-1 justify-end">
                                            <span className="text-lg font-black text-on-surface">R$</span>
                                            <input value={form.preco} onChange={set('preco')} className="text-[24px] font-bold w-36 border-b-2 border-dashed outline-none bg-transparent text-right" style={{color:"var(--ds-text-primary)",borderColor:"var(--ds-border-default)",lineHeight:"120%"}} />
                                        </div>
                                        <p className="text-[10px] mt-1" style={{color:"var(--ds-text-disabled)",lineHeight:"140%"}}>Clique para editar o valor</p>
                                        {vehicle && vehicle.precoMin && vehicle.precoMax && (
                                            <p className="text-[10px] text-slate-400 mt-0.5">
                                                Faixa IWM: R$ {vehicle.precoMin} – R$ {vehicle.precoMax}
                                            </p>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Dados do veículo */}
                            {vehicle && (
                                <div className="bg-white rounded-[16px] p-6 border border-[#DCDCE9]" style={{boxShadow:"var(--shadow-ds-level-1)"}}>
                                    <div className="flex items-center justify-between mb-5">
                                        <h3 className="text-[10px] font-semibold uppercase tracking-widest" style={{color:"var(--ds-text-secondary)",lineHeight:"140%"}}>Dados do Veículo</h3>
                                        {vehicle.placa && (
                                            <span className="flex items-center gap-1.5 text-[12px] font-semibold px-3 rounded-full" style={{color:"var(--ds-text-complementary)",backgroundColor:"rgba(91,88,143,0.1)",height:24,lineHeight:"130%"}}>
                                                <span className="material-symbols-outlined text-[14px]" style={{fontVariationSettings:"'FILL' 1"}}>id_card</span>
                                                Placa {vehicle.placa} · Final {form.finalPlaca}
                                            </span>
                                        )}
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-y-5 gap-x-4">
                                        {[
                                            ['Ano', 'ano', 'calendar_month'],
                                            ['KM', 'km', 'speed'],
                                            ['Câmbio', 'cambio', 'settings'],
                                            ['Carroceria', 'carroceria', 'directions_car'],
                                            ['Cor', 'cor', 'palette'],
                                            ['Combustível', 'combustivel', 'local_gas_station'],
                                            ['Portas', 'portas', 'sensor_door'],
                                            ['Blindado', 'blindado', 'shield'],
                                        ].map(([label, key, icon]) => (
                                            <div key={key} className="flex items-start gap-2">
                                                <span className="material-symbols-outlined text-[16px] mt-0.5" style={{color:"#BEBEBF"}}>{icon}</span>
                                                <div className="flex-1 min-w-0">
                                                    <p className="text-[10px] font-semibold uppercase tracking-wider mb-1" style={{color:"var(--ds-text-disabled)",lineHeight:"140%"}}>{label}</p>
                                                    <input value={form[key] || ''} onChange={set(key)} className="text-[14px] font-semibold border-b border-dashed outline-none bg-transparent w-full" style={{color:"var(--ds-text-primary)",borderColor:"var(--ds-border-default)",lineHeight:"140%"}} />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Características — toggles */}
                            <div className="bg-white rounded-[16px] p-6 border border-[#DCDCE9]" style={{boxShadow:"var(--shadow-ds-level-1)"}}>
                                <div className="flex items-center gap-2 mb-4">
                                    <h3 className="text-[10px] font-semibold uppercase tracking-widest" style={{color:"var(--ds-text-secondary)",lineHeight:"140%"}}>Características</h3>
                                    <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full" style={{backgroundColor:"#F7F7F9",color:"var(--ds-text-secondary)",lineHeight:"140%"}}>Ative as que se aplicam</span>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                    {Object.keys(toggleLabels).map(k => <Toggle key={k} k={k} />)}
                                </div>
                            </div>

                            {/* Itens do veículo */}
                            {vehicle && vehicle.itens && vehicle.itens.length > 0 && (
                                <div className="bg-white rounded-[16px] p-6 border border-[#DCDCE9]" style={{boxShadow:"var(--shadow-ds-level-1)"}}>
                                    <h3 className="text-[10px] font-semibold uppercase tracking-widest mb-4" style={{color:"var(--ds-text-secondary)",lineHeight:"140%"}}>Itens do Veículo</h3>
                                    <div className="flex flex-wrap gap-2">
                                        {vehicle.itens.map((item, i) => (
                                            <span key={i} className="px-4 rounded-full text-[14px] font-semibold border transition-colors" style={{height:32,display:"inline-flex",alignItems:"center",backgroundColor:"#F5F2FF",color:"var(--ds-text-primary)",borderColor:"#DCDCE9",lineHeight:"140%"}}>{item}</span>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Descrição */}
                            <div className="bg-white rounded-[16px] p-6 border border-[#DCDCE9]" style={{boxShadow:"var(--shadow-ds-level-1)"}}>
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-[10px] font-semibold uppercase tracking-widest" style={{color:"var(--ds-text-secondary)",lineHeight:"140%"}}>Descrição do anúncio</h3>
                                    <span className="flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full" style={{color:"var(--ds-text-complementary)",backgroundColor:"rgba(91,88,143,0.1)",lineHeight:"140%"}}>
                                        <span className="material-symbols-outlined text-[12px]" style={{fontVariationSettings:"'FILL' 1"}}>auto_awesome</span>
                                        Gerado automaticamente
                                    </span>
                                </div>
                                <textarea
                                    value={form.descricao}
                                    onChange={set('descricao')}
                                    rows={5}
                                    className="w-full text-[14px] rounded-[8px] p-4 outline-none resize-none transition-all" style={{color:"var(--ds-text-secondary)",lineHeight:"140%",border:"1px dashed #DCDCE9",backgroundColor:"var(--ds-bg-page)"}}
                                    placeholder="Descreva o veículo para o comprador..."
                                />
                                <p className="text-[10px] mt-1" style={{color:"var(--ds-text-disabled)",lineHeight:"140%"}}>Edite o texto acima para personalizar sua descrição.</p>
                            </div>

                            {/* Actions */}
                            <div className="flex flex-col-reverse md:flex-row gap-3 pt-2">
                                <button onClick={() => navigate('/placa')} className="h-12 px-6 border-2 font-semibold rounded-[8px] hover:bg-gray-50 transition-all flex items-center justify-center gap-2 text-[14px] md:w-auto w-full" style={{borderColor:"var(--ds-border-default)",color:"var(--ds-text-secondary)",lineHeight:"130%"}}>
                                    <span className="material-symbols-outlined text-[18px]">arrow_back</span>
                                    Voltar
                                </button>
                                <button
                                    onClick={handlePublicar}
                                    disabled={loading}
                                    className={["flex-1 h-12 font-semibold rounded-[8px] text-[16px] transition-all flex items-center justify-center gap-2", loading ? "bg-[#BEBEBF] text-white cursor-not-allowed" : "signature-gradient text-white cursor-pointer"].join(' ')}
                                >
                                    {loading ? (
                                        <React.Fragment>
                                            <svg className="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                                            </svg>
                                            Publicando...
                                        </React.Fragment>
                                    ) : (
                                        <React.Fragment>
                                            <span className="material-symbols-outlined">publish</span>
                                            Publicar Anúncio
                                        </React.Fragment>
                                    )}
                                </button>
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        // --- Meus Vídeos Screen ---

        const VIDEOS_KEY = 'wm_studio_videos';
        const loadVideosGlobal = () => { try { return JSON.parse(localStorage.getItem(VIDEOS_KEY) || '[]'); } catch(e) { return []; } };
        const saveVideosGlobal = (list) => { try { localStorage.setItem(VIDEOS_KEY, JSON.stringify(list)); } catch(e) {} };

        const MeusVideosScreen = () => {
            const navigate = useNavigate();
            const [videos, setVideos] = React.useState(loadVideosGlobal);
            const pollingRefs = React.useRef({});

            const formatDate = (iso) => {
                const d = new Date(iso);
                return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            };

            const updateVideo = (taskId, patch) => {
                setVideos(prev => {
                    const updated = prev.map(v => v.task_id === taskId ? { ...v, ...patch } : v);
                    saveVideosGlobal(updated);
                    return updated;
                });
            };

            const startPolling = (taskId) => {
                if (pollingRefs.current[taskId]) return; // already polling
                const interval = setInterval(async () => {
                    try {
                        const res = await fetch('https://studio-xefd.onrender.com/video-status/' + taskId);
                        const data = await res.json();
                        if (data.status === 'succeeded' && data.video_url) {
                            updateVideo(taskId, { status: 'succeeded', video_url: data.video_url });
                            clearInterval(pollingRefs.current[taskId]);
                            delete pollingRefs.current[taskId];
                        } else if (data.status === 'failed') {
                            updateVideo(taskId, { status: 'failed' });
                            clearInterval(pollingRefs.current[taskId]);
                            delete pollingRefs.current[taskId];
                        }
                    } catch(e) { console.error('Polling error:', e); }
                }, 5000);
                pollingRefs.current[taskId] = interval;
            };

            // On mount: start polling for all pending videos
            React.useEffect(() => {
                videos.forEach(v => {
                    if (v.status === 'generating') startPolling(v.task_id);
                });
                return () => {
                    Object.values(pollingRefs.current).forEach(clearInterval);
                };
            }, []);

            const deleteVideo = (taskId) => {
                if (pollingRefs.current[taskId]) { clearInterval(pollingRefs.current[taskId]); delete pollingRefs.current[taskId]; }
                setVideos(prev => { const updated = prev.filter(v => v.task_id !== taskId); saveVideosGlobal(updated); return updated; });
            };

            return (
                <div className="flex min-h-screen bg-[#F7F7F9]">
                    <Sidebar version="collapsed" />
                    <div className="flex-1 flex flex-col">
                        <TopBar version="slim" />
                        <main className="flex-1 px-4 md:px-8 py-8 max-w-[1000px] mx-auto w-full">

                            {/* Header */}
                            <div className="flex items-center justify-between mb-8">
                                <div>
                                    <button onClick={() => navigate('/studio')} className="flex items-center gap-2 text-slate-400 hover:text-slate-600 text-xs font-bold uppercase tracking-wider mb-3 transition-colors">
                                        <span className="material-symbols-outlined text-[16px]">arrow_back</span>
                                        Voltar ao Estúdio
                                    </button>
                                    <h1 className="text-2xl font-black text-on-surface tracking-tight">Meus Vídeos</h1>
                                    <p className="text-sm text-slate-400 mt-1">Vídeos gerados para redes sociais. Prontos em até 2 minutos.</p>
                                </div>
                                <div className="flex items-center gap-2 px-4 py-2 rounded-xl bg-white border border-slate-200 text-xs font-semibold text-slate-500">
                                    <span className="material-symbols-outlined text-[16px] text-[#7c3aed]">video_library</span>
                                    {videos.length} vídeo{videos.length !== 1 ? 's' : ''}
                                </div>
                            </div>

                            {/* Empty state */}
                            {videos.length === 0 && (
                                <div className="flex flex-col items-center justify-center py-24 text-center">
                                    <div className="w-20 h-20 rounded-full bg-[#7c3aed]/10 flex items-center justify-center mb-6">
                                        <span className="material-symbols-outlined text-[#7c3aed] text-4xl">movie</span>
                                    </div>
                                    <h2 className="text-lg font-black text-on-surface mb-2">Nenhum vídeo ainda</h2>
                                    <p className="text-sm text-slate-400 max-w-xs mb-6">Selecione o fundo "Redes Sociais" no Estúdio e gere seu primeiro vídeo para TikTok e Reels.</p>
                                    <button onClick={() => navigate('/studio')} className="h-11 px-6 bg-gradient-to-br from-[#7c3aed] to-[#4f46e5] text-white font-bold rounded-lg text-sm flex items-center gap-2 hover:shadow-lg transition-all">
                                        <span className="material-symbols-outlined text-[18px]">add</span>
                                        Gerar primeiro vídeo
                                    </button>
                                </div>
                            )}

                            {/* Video list */}
                            <div className="space-y-4">
                                {videos.map((v) => (
                                    <div key={v.task_id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden" style={{boxShadow:'var(--shadow-ds-level-1)'}}>
                                        <div className="flex gap-4 p-4">

                                            {/* Thumbnail */}
                                            <div className="w-20 h-20 rounded-xl overflow-hidden flex-shrink-0 bg-slate-100">
                                                {v.thumbnail ? (
                                                    <img src={v.thumbnail} className="w-full h-full object-cover" alt="thumb" />
                                                ) : (
                                                    <div className="w-full h-full flex items-center justify-center">
                                                        <span className="material-symbols-outlined text-slate-300 text-3xl">image</span>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Info */}
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-start justify-between gap-2">
                                                    <div>
                                                        <p className="text-xs text-slate-400 mb-1">{formatDate(v.created_at)}</p>
                                                        <div className="flex items-center gap-2">
                                                            {v.status === 'generating' && (
                                                                <span className="inline-flex items-center gap-1.5 text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-50 text-amber-600 border border-amber-200">
                                                                    <svg className="animate-spin h-3 w-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                                                                    Gerando...
                                                                </span>
                                                            )}
                                                            {v.status === 'succeeded' && (
                                                                <span className="inline-flex items-center gap-1.5 text-[11px] font-bold px-2.5 py-1 rounded-full bg-green-50 text-green-600 border border-green-200">
                                                                    <span className="material-symbols-outlined text-[12px]" style={{fontVariationSettings:"'FILL' 1"}}>check_circle</span>
                                                                    Pronto
                                                                </span>
                                                            )}
                                                            {v.status === 'failed' && (
                                                                <span className="inline-flex items-center gap-1.5 text-[11px] font-bold px-2.5 py-1 rounded-full bg-red-50 text-red-500 border border-red-200">
                                                                    <span className="material-symbols-outlined text-[12px]">error</span>
                                                                    Erro
                                                                </span>
                                                            )}
                                                            <span className="text-[10px] text-slate-300 font-mono">{v.task_id.substring(0, 16)}...</span>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => deleteVideo(v.task_id)} className="p-1.5 text-slate-300 hover:text-red-400 transition-colors rounded-lg hover:bg-red-50">
                                                        <span className="material-symbols-outlined text-[18px]">delete</span>
                                                    </button>
                                                </div>

                                                {/* Video player when ready */}
                                                {v.status === 'succeeded' && v.video_url && (
                                                    <div className="mt-3 space-y-2">
                                                        <video src={v.video_url} controls className="w-full rounded-xl border border-slate-100 max-h-64" />
                                                        <a
                                                            href={'https://studio-xefd.onrender.com/download-proxy?url=' + encodeURIComponent(v.video_url)}
                                                            download="video_redes_sociais.mp4"
                                                            className="inline-flex items-center gap-2 h-9 px-4 bg-gradient-to-br from-[#7c3aed] to-[#4f46e5] text-white text-xs font-bold rounded-lg hover:shadow-md transition-all"
                                                        >
                                                            <span className="material-symbols-outlined text-[16px]">download</span>
                                                            Baixar vídeo
                                                        </a>
                                                    </div>
                                                )}

                                                {v.status === 'generating' && (
                                                    <p className="text-xs text-slate-400 mt-2">Pode levar até 2 minutos. Você pode fechar esta tela e voltar depois.</p>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        // --- App Component ---

        const App = () => {
            return (
                <MemoryRouter>
                    <Routes>
                        <Route path="/" element={<UploadScreen />} />
                        <Route path="/studio" element={<StudioScreen />} />
                        <Route path="/placa" element={<PlacaScreen />} />
                        <Route path="/anuncio" element={<AnuncioScreen />} />
                        <Route path="/meus-videos" element={<MeusVideosScreen />} />
                    </Routes>
                </MemoryRouter>
            );
        };

        const rootElement = document.getElementById('root');
        const root = createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
